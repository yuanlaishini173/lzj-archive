<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 劉仲敬檔案館</title>
<style>
:root{--bg:#f7f4ee;--fg:#22201c;--muted:#7a7468;--line:#e2dccf;--accent:#8a2b1f}
@media (prefers-color-scheme:dark){:root{--bg:#1a1917;--fg:#e8e4dc;--muted:#9a9488;--line:#34322e;--accent:#e08a74}}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.9 "Noto Serif TC","Songti TC","Source Han Serif",serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 80px}
a{color:var(--accent)}
.back{font:14px system-ui,sans-serif;text-decoration:none}
h1{font-size:30px;line-height:1.4;margin:24px 0 8px}
.meta{font:14px system-ui,sans-serif;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
img,figure{max-width:100%;height:auto}
blockquote{border-left:3px solid var(--line);margin:0;padding-left:16px;color:var(--muted)}
</style>
</head>
<body>
<main>
<a class="back" href="../">← 返回檔案館</a>
<h1>{{TITLE}}</h1>
<div class="meta">劉仲敬 · {{DATE}} · 原文：<a href="{{SOURCE}}" rel="noopener">Medium</a></div>
<article>{{BODY}}</article>
</main>
</body>
</html>
