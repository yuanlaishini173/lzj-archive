name: Monthly collect & deploy

on:
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      resolve_limit:
        description: "本次最多校正多少个视频的精确日期"
        default: "250"
      sources:
        description: "要采集的来源（空格分隔）"
        default: "books medium lzjscript youtube"
  push:
    branches: [main]
    paths: ["templates/**", "build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp

      - name: Collect
        if: github.event_name != 'push'
        working-directory: collect
        env:
          YT_RESOLVE_LIMIT: ${{ github.event.inputs.resolve_limit || '250' }}
          SOURCES: ${{ github.event.inputs.sources || 'books medium lzjscript youtube' }}
        run: |
          # 每个来源独立运行，一个失败不影响其他
          for s in $SOURCES; do
            echo "::group::$s"
            python $s.py || echo "::warning::$s collector failed"
            echo "::endgroup::"
          done

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "lzj-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: monthly collect $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
